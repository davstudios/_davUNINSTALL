[package]
name = "davuninstall"
version = "0.11.5"
description = "_davUNINSTALL desktop application"
authors = ["_davstudios"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "davuninstall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-ico"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
